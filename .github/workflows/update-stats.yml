name: Update GitHub Analytics Cache

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Grants write permissions to push the updated JSON file back to the repo

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Fetch Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # Make sure to add GH_TOKEN as a repository secret on GitHub
        run: node scripts/fetch-github-stats.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github-stats.json
          
          # Only commit and push if there are actual diffs in the stats file
          if git diff-index --quiet HEAD -- public/data/github-stats.json; then
            echo "No changes detected in GitHub stats. Skipping commit."
          else
            git commit -m "chore: update GitHub repository telemetry cache [skip ci]"
            git push
          fi
